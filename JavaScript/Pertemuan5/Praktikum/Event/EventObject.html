<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Object</title>
</head>
<body>

<div id="parent" style="padding: 20px;">
    Parent Div
    <div id="child" style="padding: 20px;">
        Child Div
    </div>
</div>

    <button id="myButton">Klik</button>
    <a href="https://www.youtube.com" id="myLink">Klik Link</a>

    <script>
        document.getElementById("parent").addEventListener("click", function(event) {
            alert("Event")
        });
        document.getElementById("child").addEventListener("click", function(event) {
            event.stopPropagation();
            alert("Event Child")
        });
        document.getElementById("myButton").addEventListener("click", function(event) {
            console.log("Event Type: ", event.type);
            console.log("Event Target: ", event.target);
        });

        document.getElementById("myLink").addEventListener("click", function(event) {
            event.preventDefault();
            console.log("Tautan diklik, tetapi tidak diarahkan ke halaman lain.");
        });
    </script>
</body>
</html>
