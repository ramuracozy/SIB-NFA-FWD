<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengubah Teks Elemen</title>
</head>
<body>
    <h1 id="judul">Selamat Datang</h1> <!-- kasih id biar gampang diubah -->

    <button onclick="ubahteks()">Ubah Teks</button>
    <p id="paragraph">Ini adalah paragraph</p>
    <button onclick="ubahGaya()">Ubah</button>

    <div id="container"> <!-- id diperbaiki ke huruf kecil -->
        <p id="paragraph2">Ini adalah paragraph di dalam container</p>
    </div>

    <button onclick="tambahElemen()">Tambah paragraph</button>
    <button onclick="hapusElemen()">Hapus Paragraph</button>
</body>
<script>
    function ubahteks() {
        document.getElementById("judul").innerText = 
            "teks selamat datang diubah ke selamat pagi";
    }

    function ubahGaya() {
        let p = document.getElementById("paragraph");
        p.style.color = "red";
        p.style.fontSize = "20px";
    }

    function tambahElemen() {
        let paragraphBaru = document.createElement("p");
        paragraphBaru.innerText = "Paragraph Baru telah ditambahkan";
        document.getElementById("container").appendChild(paragraphBaru);
    }

    function hapusElemen() {
        let container = document.getElementById("container");
        let paragraph = container.querySelector("p"); // cari <p> pertama di dalam container
        if (paragraph) {
            container.removeChild(paragraph);
        } else {
            alert("Tidak ada paragraph untuk dihapus");
        }
    }
</script>
</html>
